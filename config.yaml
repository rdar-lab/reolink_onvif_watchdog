# Reolink ONVIF Watchdog — Configuration
#
# Passwords are NOT stored here. Set them as environment variables:
#   CAMERA_<N>   where N is the 1-based position of the camera in this file
#   e.g. CAMERA_1 for the first camera, CAMERA_2 for the second, etc.
#
# A single fallback variable CAMERA_PASSWORD is used when no per-camera
# variable is found.

# How often (seconds) to run the ONVIF health check for each camera
check_interval: 30

# Number of consecutive failures before triggering a service cycle
retry_count: 3

# Seconds to wait between individual retry attempts
retry_delay: 5

# Seconds to keep ONVIF/RTSP disabled before re-enabling them
cycle_wait: 60

cameras:
  - name: frontdoor
    ip: 192.168.1.100
    onvif_port: 8000
    http_port: 80
    username: admin

  - name: backyard
    ip: 192.168.1.101
    onvif_port: 8000
    http_port: 80
    username: admin
